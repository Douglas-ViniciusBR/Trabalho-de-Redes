<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Erro Interno do Servidor</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #333; text-align: center; padding: 50px; }
        .container { background: #fff; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #c0392b; font-size: 48px; margin-bottom: 10px; }
        p { font-size: 16px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>500 / 502</h1>
        <h2>Erro Interno no Servidor</h2>
        <p>Ocorreu uma falha temporária no processamento do sistema. A equipe de infraestrutura já foi notificada.</p>
    </div>
</body>
</html>
