server {
    listen 80;
    server_name 10.0.1.10;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 10.0.1.10;

    root /var/www/html;
    index index.html;

    ssl_certificate /etc/ssl/certs/servidor-web.crt;
    ssl_certificate_key /etc/ssl/private/servidor-web.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        try_files $uri $uri/ =404;
    }
}
