#!/usr/sbin/nft -f

flush ruleset

# ==========================================
# FILTRO DE REDE
# ==========================================

table inet filter {

    chain input {
        type filter hook input priority filter;
        policy drop;

        # Permite conexoes estabelecidas
        ct state established,related accept

        # Bloqueia pacotes invalidos
        ct state invalid drop

        # Permite comunicacao local
        iifname "lo" accept

        # Permite ping IPv4
        ip protocol icmp accept

        # SSH temporariamente permitido por todas as interfaces
        tcp dport 22 accept

        # Permite respostas DHCP na interface WAN
        iifname "enp0s3" udp sport 67 udp dport 68 accept
    }

    chain forward {
        type filter hook forward priority filter;
        policy drop;

        # Permite conexoes estabelecidas
        ct state established,related accept

        # Bloqueia pacotes invalidos
        ct state invalid drop

        # LAN acessa a internet
        iifname "enp0s9" oifname "enp0s3" ip saddr 10.0.2.0/24 accept

        # LAN acessa DMZ por SSH
        iifname "enp0s9" oifname "enp0s8" ip saddr 10.0.2.0/24 tcp dport 22 accept

        # LAN acessa DB por SSH
        iifname "enp0s9" oifname "enp0s10" ip saddr 10.0.2.0/24 tcp dport 22 accept

        # Servidor Web acessa PostgreSQL
        # DMZ acessa a internet
        iifname "enp0s8" oifname "enp0s3" ip saddr 10.0.1.0/24 accept
        iifname "enp0s8" oifname "enp0s10" ip saddr 10.0.1.10 ip daddr 10.0.3.10 tcp dport 5432 accept
    }

    chain output {
        type filter hook output priority filter;
        policy accept;
    }
}

# ==========================================
# NAT - ACESSO DA LAN A INTERNET
# ==========================================

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat;

        # Compartilha a conexao WAN com a LAN
        oifname "enp0s3" ip saddr 10.0.2.0/24 masquerade
        # Compartilha internet com a DMZ
        oifname "enp0s3" ip saddr 10.0.1.0/24 masquerade
    }
}
