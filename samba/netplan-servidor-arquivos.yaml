# /etc/netplan/00-installer-config.yaml - Servidor de Arquivos (LAN)
# Troque enp0s3 pelo nome real da interface (veja com: ip -br link)
# Aplicar: sudo netplan apply
network:
  version: 2
  ethernets:
    enp0s3:
      dhcp4: false
      addresses:
        - 10.0.2.10/24
      routes:
        - to: default
          via: 10.0.2.1
      nameservers:
        addresses:
          - 1.1.1.1
          - 8.8.8.8
