# =============================================================================
# /etc/samba/smb.conf - Servidor de Arquivos (empresa.local)
# Servidor: 10.0.2.10 (LAN 10.0.2.0/24) - Ubuntu Server + Samba 4
# Após editar, valide com: testparm
# =============================================================================

[global]
    workgroup = WORKGROUP
    server string = Servidor de Arquivos Corporativo - empresa.local
    # NetBIOS name tem no máximo 15 caracteres
    netbios name = SRV-ARQUIVOS
    server role = standalone server
    security = user
    obey pam restrictions = yes

    # Usuário inexistente/errado vira convidado (usado só pelo share [publico])
    map to guest = Bad User

    # Rede: escuta só na LAN e aceita só clientes autorizados
    interfaces = lo 10.0.2.10/24
    bind interfaces only = yes
    hosts allow = 127.0.0.1 10.0.2.0/24 10.0.3.10
    hosts deny = ALL

    # Protocolo seguro (SMB1 desativado) e sem NetBIOS legado
    server min protocol = SMB2
    disable netbios = yes
    smb ports = 445 139
    dns proxy = no

    # Logs
    logging = file
    log file = /var/log/samba/log.%m
    max log size = 1000

# -----------------------------------------------------------------------------
# Pasta pública: leitura e escrita livres para a LAN (convidado)
# -----------------------------------------------------------------------------
[publico]
    comment = Arquivos de uso geral
    path = /srv/samba/compartilhado/publico
    browseable = yes
    guest ok = yes
    read only = no
    create mask = 0664
    directory mask = 2775

# -----------------------------------------------------------------------------
# Projetos: somente grupos devs e diretoria
# -----------------------------------------------------------------------------
[projetos]
    comment = Area de trabalho colaborativo
    path = /srv/samba/compartilhado/projetos
    browseable = yes
    guest ok = no
    valid users = @devs, @diretoria
    read only = no
    inherit acls = yes
    create mask = 0660
    directory mask = 2770

# -----------------------------------------------------------------------------
# Backups: somente grupo backup_mgr (recebe os .tar.gz do PostgreSQL)
# -----------------------------------------------------------------------------
[backups]
    comment = Destino dos backups automaticos
    path = /srv/samba/compartilhado/backups
    browseable = yes
    guest ok = no
    valid users = @backup_mgr
    read only = no
    create mask = 0660
    directory mask = 2770
